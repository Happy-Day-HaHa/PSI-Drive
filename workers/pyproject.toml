[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-workers"
version = "0.1.0"
description = "PSI Studio signal processing workers"
requires-python = ">=3.11"
dependencies = ["celery[redis]>=5.4"]

[tool.setuptools.packages.find]
include = ["psi_workers*"]
